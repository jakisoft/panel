<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Section -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="16" fill="url(#bgGrad)"/>
    <rect width="56" height="56" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

    <g filter="url(#glow)">
      <path d="M28 10L45 19L28 28L11 19L28 10Z" fill="url(#indigoGrad)"/>
      <path d="M11 24.5L28 33.5L45 24.5" stroke="url(#indigoGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 32.5L28 41.5L45 32.5" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="19" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Text Section -->
  <text x="74" y="33" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em">JKSoft <tspan fill="#38bdf8">Cloud</tspan></text>
  <text x="74" y="49" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="0.02em">Game Server &amp; Cloud Platform</text>
</svg>
