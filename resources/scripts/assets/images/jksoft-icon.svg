    <path d="M15 36.5L32 45.5L49 36.5" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="23" r="2.5" fill="#ffffff"/>
